[project]
name = "inragwetrust"
version = "0.1.0"
description = "In RAG We Trust? Measuring RAG robustness to poisoned and conflicting evidence (NLP final project P5, UniMi)."
readme = "README.md"
authors = [{ name = "Angela Aldaoud" }]
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "matplotlib",
    "pyyaml",
    "rank-bm25",
    "tqdm",
]

[project.optional-dependencies]
gpu = [
    "torch",
    "transformers",
    "accelerate",
    "bitsandbytes",
    "vllm",
]

[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inragwetrust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
