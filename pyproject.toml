[project]
name = "inragwetrust"
version = "0.1.0"
description = "In RAG We Trust? Measuring RAG robustness to poisoned and conflicting evidence (NLP final project P5, UniMi)."
readme = "README.md"
authors = [{ name = "Angela Aldaoud" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "datasets",
    "numpy",
    "pandas",
    "scipy",
    "statsmodels==0.15.0",
    "matplotlib",
    "pyyaml",
    "rank-bm25",
    "tqdm",
    "pyarrow>=25.0.1",
    "spacy==3.8.11",
    "thinc==8.3.10",
    "en-core-web-sm",
]



[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
    "nbconvert>=7.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inragwetrust"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Lock only for the two machines we use: the Mac (Apple silicon) and Colab (Linux x86_64).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
